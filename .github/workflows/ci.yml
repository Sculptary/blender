name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_api.py
      - run: python build.py
  blender:
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: 4.2.23
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libice6 libegl1 libgl1
      - name: Download a verified Blender build
        shell: bash
        run: |
          tool_directory="$RUNNER_TEMP/sculptary-blender"
          archive_name="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p "$tool_directory"
          cd "$tool_directory"
          curl -fsSLO "https://download.blender.org/release/Blender4.2/$archive_name"
          curl -fsSLO "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}.sha256"
          awk -v archive="$archive_name" '$2 == archive || $2 == "*" archive { print }' "blender-${BLENDER_VERSION}.sha256" | sha256sum --check --strict
          tar -xJf "$archive_name"
      - name: Native branch and publish checks
        run: '"$RUNNER_TEMP/sculptary-blender/blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup --python-exit-code 1 --python tests/blender_branches.py'
